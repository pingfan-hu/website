        target: _blank

format:
  html:
    toc: true
    toc-depth: 5
    toc-location: right
    lightbox: true
    theme:
      light: [flatly, styles/theme.scss]
      dark: [darkly, styles/theme.scss]
    embed-resources: false
    link-external-newwindow: true
    link-external-icon: false
    link-external-filter: '^(?:http:|https:)\/\/(?:www\.)?pingfanhu\.com'
    include-after-body:
      text: |
        <script>
        (function() {
          function init() {
            var targets = document.querySelectorAll('.quarto-post, .quarto-grid-item, .presentation-box');
            if (!targets.length || !window.IntersectionObserver) return;
            targets.forEach(function(el, i) {
              el.classList.add('animate-on-scroll');
              el.style.setProperty('--anim-delay', Math.min(i * 60, 300) + 'ms');
            });
            var obs = new IntersectionObserver(function(entries) {
              entries.forEach(function(entry) {
                if (entry.isIntersecting) {
                  entry.target.classList.add('is-visible');
                  obs.unobserve(entry.target);
                }
              });
            }, { threshold: 0.08 });
            targets.forEach(function(el) { obs.observe(el); });
          }
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
          } else {
            init();
          }
        })();
        </script>

knitr: 
  opts_chunk: 
    comment: "#>"
    fig.align: "center"
    fig.show: "hold"
    fig.asp: 0.618
    fig.retna: 3
    out.width: 80%

execute:
  warning: false
