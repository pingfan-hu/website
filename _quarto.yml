project:
  type: website
  render:
    - "**/*.qmd"
    - "!**/resources/*.qmd"
    - "!**/html/*.qmd"
  resources:
    - resources/files/
    - presentations/
    - resources/images/
    - projects/banners/
    - blog/banners/
    - resources/fonts/

language:
  listing-page-filter: "查找"
  toc-title-website: "Table of contents"

website:
  title: Pingfan Hu
  image: resources/images/card.png
  favicon: resources/images/favicon.png
  description: Pingfan Hu - Data science PhD in sustainable transportation and open-source software.
  site-url: https://pingfanhu.com
  repo-url: https://github.com/pingfan-hu/website
  back-to-top-navigation: false
  twitter-card: true
  open-graph:
    locale: en_US
    image: resources/images/card.png
  page-footer:
    center: "© <span id='footer-year'></span> [Pingfan Hu](https://pingfanhu.com)"
    border: true
    background: light
  search:
    location: navbar
    type: overlay
    copy-button: true

  navbar:
    left:
      - icon: person-badge
        href: about.qmd
        text: About
      - icon: file-text
        href: blog.qmd
        text: Blog
      - icon: file-bar-graph
        href: projects.qmd
        text: Projects
      - icon: file-pdf
        href: papers.qmd
        text: Papers
      - icon: file-slides
        href: presentations.qmd
        text: Presentations
      - icon: journal-text
        text: 杂记
        menu:
          - icon: cup-hot
            text: 菜谱
            href: recipes.qmd
          - icon: cup-straw
            text: 鸡尾酒
            href: cocktails.qmd

    tools:
      - icon: linkedin
        href: https://www.linkedin.com/in/pingfan/
        text: LinkedIn
        target: _blank
      - icon: github
        href: https://github.com/pingfan-hu
        text: GitHub
        target: _blank
      - icon: person-vcard
        href: https://orcid.org/0009-0001-4877-4844
        text: ORCID
        target: _blank
      - icon: journal-bookmark
        href: https://www.researchgate.net/profile/Pingfan-Hu-2
        text: ResearchGate
        target: _blank
      - icon: mortarboard
        href: https://scholar.google.com/citations?hl=en&user=cHRn7ysAAAAJ&view_op=list_works&gmla=AOv-ny_SNvl4HxALL_saOPSbgciX2yIEDuqGz8VcwqjeV8_KIsvS3Clzw9UsU0HyvsfVAVgU_yJO2NLq6vLT1IL2
        text: Google Scholar
        target: _blank

format:
  html:
    toc: true
    toc-depth: 5
    toc-location: left
    lightbox: true
    highlight-style:
      light: resources/styles/code-dark.theme
      dark: resources/styles/code-light.theme
    code-copy: true
    theme:
      light: [flatly, resources/styles/styles.scss]
      dark: [darkly, resources/styles/styles.scss]
    embed-resources: false
    link-external-newwindow: true
    link-external-icon: false
    link-external-filter: '^(?:http:|https:)\/\/(?:www\.)?pingfanhu\.com'
    include-after-body:
      text: |
        <script src="/resources/styles/styles.js"></script>

knitr: 
  opts_chunk: 
    comment: "#>"
    fig.align: "center"
    fig.show: "hold"
    fig.asp: 0.618
    fig.retna: 3
    out.width: 80%

execute:
  warning: false
