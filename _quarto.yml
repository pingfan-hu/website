  repo-url: https://github.com/pingfan-hu/website
  back-to-top-navigation: false
  twitter-card: true
  open-graph:
    locale: en_US
    image: images/card.png
  page-footer:
    center: "© 2025 [Pingfan Hu](https://pingfanhu.com)"
    border: true
    background: light
  search:
    location: navbar
    type: overlay
    copy-button: true

  navbar:
    left:
      - icon: person-badge
        href: about.qmd
        text: About
      - icon: file-text
        href: blog.qmd
        text: Blog
      - icon: file-bar-graph
        href: projects.qmd
        text: Projects
      - icon: file-pdf
        href: papers.qmd
        text: Papers
      - icon: file-slides
        href: talks.qmd
        text: Talks

    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/pingfan/
