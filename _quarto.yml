project:
  type: website
  resources:
    - files/
    - talks/
    - images/
    - projects/banners/
    - blog/banners/

website:
  title: Pingfan Hu
  image: images/card.png
  favicon: images/favicon.png
  description: Pingfan Hu - PhD candidate at GWU in sustainable transportation and open-source survey tech.
  site-url: https://pingfanhu.com
  repo-url: https://github.com/pingfan-hu/website
  back-to-top-navigation: false
  twitter-card: true
  open-graph:
    locale: en_US
  page-footer:
    center: "© 2025 [Pingfan Hu](https://pingfanhu.com)"
    border: true
    background: light
  search:
    location: navbar
    type: overlay
    copy-button: true

  navbar:
    left:
      - icon: person-badge
        href: about.qmd
        text: About
      - icon: file-text
        href: blog.qmd
        text: Blog
      - icon: file-bar-graph
        href: projects.qmd
        text: Projects
      - icon: file-pdf
        href: papers.qmd
        text: Papers
      - icon: file-slides
        href: talks.qmd
        text: Talks

    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/pingfan/
        target: _blank
      - icon: github
        href: https://github.com/pingfan-hu
        target: _blank
      - text: "<i class='fa-brands fa-orcid'></i>"
        href: https://orcid.org/0009-0001-4877-4844
        target: _blank
      - text: "<i class='fa-brands fa-researchgate'></i>"
        href: https://www.researchgate.net/profile/Pingfan-Hu-2
        target: _blank
      - text: "<i class='fa-brands fa-google-scholar'></i>"
        href: https://scholar.google.com/citations?hl=en&user=cHRn7ysAAAAJ&view_op=list_works&gmla=AOv-ny_SNvl4HxALL_saOPSbgciX2yIEDuqGz8VcwqjeV8_KIsvS3Clzw9UsU0HyvsfVAVgU_yJO2NLq6vLT1IL2
        target: _blank

format:
  html:
    toc: true
    toc-depth: 5
    toc-location: right
    lightbox: true
    css: styles/styles.css
    theme: [united, styles/theme.scss]
    embed-resources: true
    link-external-newwindow: true
    link-external-icon: false
    link-external-filter: '^(?:http:|https:)\/\/(?:www\.)?pingfanhu\.com'
    backgroundcolor: "#F8F7F0"

knitr: 
  opts_chunk: 
    comment: "#>"
    fig.align: "center"
    fig.show: "hold"
    fig.asp: 0.618
    fig.retna: 3
    out.width: 80%

execute:
  warning: false
