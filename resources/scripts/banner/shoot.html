<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Banner</title>
<!-- Draws one banner from its spec for make-banners.sh to shoot:
     shoot.html?id=<folder>[&dark]. The drawing is the one the listings
     show live (resources/banners/banner.js). -->
<style>html, body { margin: 0; width: 1376px; height: 768px; overflow: hidden; }</style>
<script src="../../banners/banner.js"></script>
<script src="../../banners/specs.js"></script>
</head>
<body>
<script>
 var q = new URLSearchParams(location.search), spec = window.BANNER_SPECS[q.get("id")];
 if (!spec) document.body.textContent = "no spec: " + q.get("id");
 else Banner.render(spec, document.body, { dark: q.has("dark") });
</script>
</body>
</html>
