title: CV
author: Pingfan Hu
version: 1.0.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    pdf:
      toc: false
      number-sections: false
      colorlinks: true
      documentclass: scrartcl
      papersize: a4
      pdf-engine: xelatex
      fontsize: 11pt
      geometry:
        - margin=1in
        - heightrounded
      include-in-header:
        - preamble.tex
